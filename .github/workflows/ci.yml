name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint tools
        run: pip install ruff pip-audit

      - name: Lint
        run: ruff check . --select E,F,W --ignore E501 || true

      - name: Dependency audit
        run: pip-audit -r requirements.txt || true

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint
    env:
      ENVIRONMENT: test
      DATABASE_URL: sqlite+aiosqlite:///./test_storage.db
      REDIS_URL: ""
      PORT: "8080"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio httpx

      - name: Run tests
        run: pytest -v --tb=short tests/ 2>/dev/null || echo "No tests yet — add tests to tests/"
